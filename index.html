<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Floorplan Marker</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
  --accent:#2563eb; --accent-bg:#dbeafe; --danger:#dc2626; --ok:#16a34a;
  --header-h:52px; --sidebar-w:320px; --edit-w:300px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 10px;line-height:1.2}
button:hover{background:#f9fafb}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1d4ed8}
button.danger{color:var(--danger);border-color:#fecaca}
button.danger:hover{background:#fef2f2}
button.icon{padding:6px 8px;min-width:34px}
button.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=search],select,textarea{border:1px solid var(--border);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:6px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100%}
header#top{height:var(--header-h);display:flex;align-items:center;gap:8px;padding:0 10px;background:#1f2937;color:#fff;flex-shrink:0}
header#top select{width:auto;max-width:280px;background:#374151;color:#fff;border-color:#4b5563}
header#top button{background:#374151;border-color:#4b5563;color:#fff}
header#top button:hover{background:#4b5563}
header#top .brand{font-weight:600;letter-spacing:.2px;white-space:nowrap}
header#top button{white-space:nowrap;flex-shrink:0}
header#top #btnPlans .ico{display:none}
header#top .spacer{flex:1}
main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
#sidebar .sb-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
#sidebar .sb-head h2{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
#sidebar .sb-head h2 .count{background:var(--bg);border-radius:10px;padding:1px 8px;font-size:12px;color:var(--muted);font-weight:normal}
#mlist{flex:1;overflow:auto;padding:6px}
.mitem{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;align-items:flex-start}
.mitem:hover{background:#f9fafb}
.mitem.sel{background:var(--accent-bg);border-color:#93c5fd}
.mitem.done{opacity:.55}
.mitem .badge{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mitem .body{flex:1;min-width:0}
.mitem .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .title.empty{font-weight:normal;color:var(--muted);font-style:italic}
.mitem .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .notes{font-size:12px;color:#374151;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mitem input[type=checkbox]{margin:4px 0 0;width:16px;height:16px;flex-shrink:0}
.empty-state{padding:30px 16px;text-align:center;color:var(--muted);line-height:1.5}

#stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#plantabs{display:flex;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
#plantabs button{white-space:nowrap;border-radius:16px;padding:4px 12px}
#viewport{flex:1;position:relative;overflow:hidden;background:#d1d5db;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#viewport.add{cursor:crosshair}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world img{display:block;pointer-events:none;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#pins{position:absolute;left:0;top:0;width:100%;height:100%}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:scale(var(--inv,1));transform-origin:center;cursor:pointer;touch-action:none}
.pin.done{opacity:.5}
.pin.sel{box-shadow:0 0 0 4px rgba(37,99,235,.55),0 1px 4px rgba(0,0,0,.45);z-index:2}
.pin.dragging{opacity:.8;z-index:3}
#toolbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
#toolbar button{box-shadow:0 1px 3px rgba(0,0,0,.2)}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(31,41,55,.9);color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;z-index:5;pointer-events:none;white-space:nowrap}
#stage-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#374151;padding:20px;line-height:1.6;z-index:4;background:rgba(243,244,246,.85)}
#fab{display:none}

#editpanel{position:absolute;right:0;top:0;bottom:0;width:var(--edit-w);background:var(--panel);border-left:1px solid var(--border);box-shadow:-4px 0 16px rgba(0,0,0,.12);overflow:auto;padding:12px 14px;z-index:10}
#editpanel h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
#editpanel .ep-badge{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.photo-strip{display:flex;flex-wrap:wrap;gap:6px}
.photo-strip img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:#f3f4f6}
.photo-strip .ph-add{width:72px;height:72px;border:1px dashed #9ca3af;border-radius:6px;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;padding:0}
.photo-strip .ph-add span{font-size:10px;color:var(--muted)}
.photo-strip img.missing{opacity:.3}
.mitem .ph-count{font-size:11px;color:var(--muted);margin-left:6px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;flex-direction:column;color:#fff}
.lightbox .lb-top{display:flex;align-items:center;gap:8px;padding:10px 12px}
.lightbox .lb-top button{background:#374151;border-color:#4b5563;color:#fff}
.lightbox .lb-top button.danger{color:#fca5a5}
.lightbox .lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.lightbox .lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:32px;background:rgba(55,65,81,.7);border:none;color:#fff;border-radius:8px}
.lightbox .lb-prev{left:8px}.lightbox .lb-next{right:8px}
.lightbox .lb-nav:disabled{opacity:.25}
/* ---------- Sync ---------- */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;vertical-align:middle;margin-right:5px;flex-shrink:0}
.dot.on{background:#22c55e}.dot.busy{background:#f59e0b}.dot.err{background:#ef4444}
#btnSync .dot{margin:0 4px 0 0}
.sync-id{display:flex;gap:6px;align-items:center;background:#f3f4f6;border-radius:6px;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.contact{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.contact .c-name{font-weight:600}
.contact .c-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.contact .c-state{font-size:12px;color:var(--muted)}
.sync-log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#111827;color:#d1d5db;border-radius:6px;padding:8px;max-height:140px;overflow:auto;white-space:pre-wrap;margin-top:10px}
#editpanel .ep-actions{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
.check input{width:18px;height:18px}

/* ---------- Modals ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .m-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal .m-head h2{margin:0;font-size:16px;flex:1}
.modal .m-body{padding:14px 16px;overflow:auto}
.modal .m-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cat-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cat-row input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#fff;flex-shrink:0}
.plan-pick{display:flex;flex-direction:column;gap:6px}
.plan-pick label{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.plan-pick img,.lib-item img{width:64px;height:44px;object-fit:contain;background:#f3f4f6;border-radius:4px;flex-shrink:0}
.lib-item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.lib-item input[type=text]{flex:1}
.dropzone{border:2px dashed #cbd5e1;border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin-bottom:12px;cursor:pointer}
.dropzone.over{border-color:var(--accent);background:var(--accent-bg)}
.menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:60;min-width:220px;padding:4px;color:var(--text)}
.menu button{display:block;width:100%;text-align:left;border:none;border-radius:6px;padding:8px 10px;background:#fff;color:var(--text)}
.menu button:hover{background:#f3f4f6}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:100;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  :root{--header-h:48px}
  header#top .brand{display:none}
  header#top select{max-width:40vw;min-width:0}
  header#top{gap:6px;padding:0 8px}
  header#top #btnPlans .lbl{display:none}
  header#top #btnSync .lbl{display:none}
  header#top #btnSync .dot{margin:0}
  header#top #btnPlans .ico{display:inline}
  main{flex-direction:column}
  #stage{flex:1}
  #sidebar{position:absolute;left:0;right:0;bottom:0;width:auto;height:44px;border-right:none;border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.15);z-index:20;transition:height .2s}
  #sidebar.open{height:62%}
  #sidebar .sb-head{cursor:pointer;padding:8px 12px}
  #sidebar .sb-head h2::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#d1d5db;position:absolute;left:50%;top:4px;transform:translateX(-50%)}
  #sidebar .sb-head{position:relative}
  #sidebar .sb-head .search{display:none}
  #sidebar.open .sb-head .search{display:flex}
  #toolbar{bottom:54px}
  #editpanel{position:absolute;inset:0;width:auto;z-index:30;border:none}
  #fab{display:flex;position:absolute;right:14px;bottom:58px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;align-items:center;justify-content:center;border:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:21}
  #fab.active{background:var(--danger)}
  #toolbar .desktop-only{display:none}
  .pin{width:32px;height:32px;margin:-16px 0 0 -16px;font-size:13px}
}

/* ---------- Print ---------- */
#printroot{display:none}
@media print{
  @page{margin:12mm}
  html,body{overflow:visible;height:auto;background:#fff}
  #app,#toast,.modal-bg,.menu{display:none!important}
  #printroot{display:block;font-size:11pt;color:#000}
  .p-page{page-break-after:always;break-after:page}
  .p-page:last-child{page-break-after:auto;break-after:auto}
  .p-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px}
  .p-head h1{font-size:16pt;margin:0}
  .p-head h2{font-size:12pt;margin:0;font-weight:normal}
  .p-desc{margin:0 0 8px;font-size:10pt;color:#333}
  .p-plan{position:relative;width:100%;margin-bottom:10px}
  .p-plan img{width:100%;display:block;border:1px solid #999}
  .p-pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;color:#fff;font-weight:700;font-size:9pt;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 0 0 1px #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p-pin.done{opacity:.45}
  table.p-table{width:100%;border-collapse:collapse;font-size:10pt}
  table.p-table th,table.p-table td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  table.p-table th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p-table td.n{width:34px;text-align:center;font-weight:700}
  table.p-table .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p-table tr.done td{color:#777}
  table.p-table td.notes{white-space:pre-wrap}
  .p-legend{font-size:9pt;margin:0 0 8px;display:flex;gap:14px;flex-wrap:wrap}
  .p-photos-h{font-size:11pt;margin:10px 0 6px;page-break-after:avoid;break-after:avoid}
  .p-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .p-photos figure{margin:0;page-break-inside:avoid;break-inside:avoid}
  .p-photos img{width:100%;height:48mm;object-fit:cover;border:1px solid #999}
  .p-photos figcaption{font-size:9pt;margin-top:2px}
  .p-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand" data-i18n="appTitle">Floorplan Marker</span>
    <select id="projectSelect" title="Project"></select>
    <button id="btnProjectMenu" class="icon" title="Project">&#8942;</button>
    <span class="spacer"></span>
    <button id="btnPlans" data-i18n-title="plans" title="Plattegronden"><span class="ico">&#9638;</span><span class="lbl" data-i18n="plans">Plattegronden</span></button>
    <button id="btnPrint" class="icon" data-i18n-title="print" title="Afdrukken">&#128438;</button>
    <button id="btnData" class="icon" data-i18n-title="importExport" title="Import / export">&#8645;</button>
    <button id="btnSync" data-i18n-title="sync" title="Sync"><span class="dot" id="syncDot"></span><span class="lbl">Sync</span></button>
    <button id="btnLang" class="icon" title="Language">EN</button>
  </header>
  <main>
    <aside id="sidebar">
      <div class="sb-head" id="sbHead">
        <h2><span data-i18n="markers">Markeringen</span> <span class="count" id="mcount">0</span> <span class="grow"></span><span class="small muted" id="sbPlanName"></span></h2>
        <div class="row search">
          <input type="search" id="filter" data-i18n-ph="filter" placeholder="Zoeken…">
          <label class="row small muted" style="white-space:nowrap"><input type="checkbox" id="hideDone"> <span data-i18n="hideDone">Verberg gereed</span></label>
        </div>
      </div>
      <div id="mlist"></div>
    </aside>
    <section id="stage">
      <div id="plantabs"></div>
      <div id="viewport">
        <div id="world"><img id="planimg" alt=""><div id="pins"></div></div>
        <div id="hint" class="hidden"></div>
      </div>
      <div id="stage-empty" class="hidden"></div>
      <div id="toolbar">
        <button id="btnNav" class="active" data-i18n="navMode">Navigeren</button>
        <button id="btnAdd" class="desktop-only" data-i18n="addMode">+ Markering</button>
        <button id="btnFit" data-i18n="fit">Passend</button>
        <button id="btnZoomIn" class="icon desktop-only">+</button>
        <button id="btnZoomOut" class="icon desktop-only">&minus;</button>
      </div>
      <button id="fab" title="Add">+</button>
    </section>
    <aside id="editpanel" class="hidden"></aside>
  </main>
</div>
<div id="modals"></div>
<div id="printroot"></div>
<div id="toast"></div>

/* ============================================================
   IndexedDB  (schema v3)
   stores: plans, projects, markers, photos  = synced records {id, updatedAt, deleted, ...}
           assets   = content-addressed binaries {hash, blob, mime, size}
           contacts = sync peers {peerId, label, lastSeen}
           meta     = local state {key, ...}
   ============================================================ */
const RECORD_STORES = ['plans', 'projects', 'markers', 'photos'];
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('floorplan-marker', 3);
    r.onupgradeneeded = e => {
      const d = e.target.result, has = n => d.objectStoreNames.contains(n);
      if (!has('plans')) d.createObjectStore('plans', {keyPath:'id'});
      if (!has('projects')) d.createObjectStore('projects', {keyPath:'id'});
      if (!has('meta')) d.createObjectStore('meta', {keyPath:'key'});
      if (!has('photos')) d.createObjectStore('photos', {keyPath:'id'});
      if (!has('markers')) d.createObjectStore('markers', {keyPath:'id'});
      if (!has('assets')) d.createObjectStore('assets', {keyPath:'hash'});
      if (!has('contacts')) d.createObjectStore('contacts', {keyPath:'peerId'});
    };
    r.onsuccess = e => { DB.db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
    r.onblocked = () => rej(new Error('Database upgrade blocked by another open tab'));
  }); },
  tx(store, mode, fn){ return new Promise((res, rej) => {
    const tx = DB.db.transaction(store, mode); const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result); tx.onerror = e => rej(e.target.error); tx.onabort = e => rej(e.target.error);
  }); },
  getAll(s){ return DB.tx(s, 'readonly', o => o.getAll()); },
  get(s, k){ return DB.tx(s, 'readonly', o => o.get(k)); },
  put(s, v){ return DB.tx(s, 'readwrite', o => o.put(v)); },
  del(s, k){ return DB.tx(s, 'readwrite', o => o.delete(k)); },
};

/* ---------- hashing / assets ---------- */
async function sha256(bufOrBlob){
  const buf = bufOrBlob instanceof Blob ? await bufOrBlob.arrayBuffer() : bufOrBlob;
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const assets = new Map(); // hash -> Blob (all local assets, loaded at start)
const urlCache = new Map(); // hash -> object URL
const assetUrl = hash => { const b = assets.get(hash); if (!b) return ''; if (!urlCache.has(hash)) urlCache.set(hash, URL.createObjectURL(b)); return urlCache.get(hash); };
async function storeAsset(blob){
  const hash = await sha256(blob);
  if (!assets.has(hash)) { await DB.put('assets', {hash, blob, mime: blob.type, size: blob.size}); assets.set(hash, blob); }
  return hash;
}

/* ---------- migration from schema v1/v2 (embedded markers, blobs in records) ---------- */
const nowIso = () => new Date().toISOString();
async function migrate(){
  const schema = (await DB.get('meta', 'schema') || {}).v || 0;
  if (schema >= 3) return;
  const stamp = new Date(0).toISOString(); // migrated records get an epoch timestamp so any real edit wins
  for (const p of await DB.getAll('plans')) {
    if (p.image instanceof Blob) { p.hash = await storeAsset(p.image); delete p.image; }
    p.updatedAt = p.updatedAt || stamp; p.deleted = !!p.deleted; await DB.put('plans', p);
  }
  for (const pr of await DB.getAll('projects')) {
    if (Array.isArray(pr.markers)) {
      for (const m of pr.markers) await DB.put('markers', {...m, projectId: pr.id, updatedAt: m.updatedAt || stamp, deleted: !!m.deleted});
      delete pr.markers;
    }
    pr.updatedAt = pr.updatedAt || stamp; pr.deleted = !!pr.deleted; await DB.put('projects', pr);
  }
  for (const ph of await DB.getAll('photos')) {
    if (ph.image instanceof Blob) { ph.hash = await storeAsset(ph.image); delete ph.image; }
    ph.updatedAt = ph.updatedAt || stamp; ph.deleted = !!ph.deleted; await DB.put('photos', ph);
  }
  await DB.put('meta', {key: 'schema', v: 3});
}

/** Persist a record: stamps updatedAt, updates the in-memory array, notifies sync peers. */
async function putRec(store, rec, opts = {}){
  if (!opts.keepStamp) rec.updatedAt = nowIso();
  if (rec.deleted === undefined) rec.deleted = false;
  await DB.put(store, rec);
  const arr = S[store]; const i = arr.findIndex(r => r.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  if (!opts.silent) Sync.notifyChanged();
  return rec;
}
/** Tombstone a record (never physically removed, so peers learn about the deletion). */
async function delRec(store, rec, opts){ rec.deleted = true; return putRec(store, rec, opts); }
async function saveProject(p){ return putRec('projects', p); }
async function saveMarker(m){ return putRec('markers', m); }

/* ============================================================
   Image processing (floor plans)
   ============================================================ */
const MAX_DIM = 2500;
function loadImage(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function canvasToBlob(c, type, q){ return new Promise(res => c.toBlob(res, type, q)); }
async function fileToPlanBlob(file){
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImage(url);
    const scale = Math.min(1, MAX_DIM / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * scale), h = Math.round(im.naturalHeight * scale);
    if (scale === 1 && (file.type === 'image/png' || file.type === 'image/jpeg')) return {blob: file, width: w, height: h};
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
    const png = file.type === 'image/png' || file.type === 'image/gif' || file.type === 'image/svg+xml';
    const blob = await canvasToBlob(c, png ? 'image/png' : 'image/jpeg', 0.9);
    return {blob, width: w, height: h};
  } finally { URL.revokeObjectURL(url); }
}
let pdfjsPromise = null;
function loadPdfJs(){
  if (!pdfjsPromise) pdfjsPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror = () => rej(new Error('pdf.js could not be loaded (offline?)')); document.head.appendChild(s);
  });
  return pdfjsPromise;
}
async function pdfToPlans(file){
  const pdfjs = await loadPdfJs();
  const pdf = await pdfjs.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [], base = file.name.replace(/\.pdf$/i, '');
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: MAX_DIM / Math.max(v1.width, v1.height)});
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    out.push({name: pdf.numPages > 1 ? `${base} – ${t('pdfPage')} ${i}` : base, blob: await canvasToBlob(c, 'image/png'), width: c.width, height: c.height});
  }
  return out;
}
async function addPlanFiles(files){
  const list = Array.from(files).filter(f => /^image\//.test(f.type) || f.type === 'application/pdf');
  if (!list.length) return 0;
  toast(t('processing'));
  let n = 0;
  for (const f of list) {
    try {
      const items = f.type === 'application/pdf' ? await pdfToPlans(f) : [{name: f.name.replace(/\.[^.]+$/, ''), ...(await fileToPlanBlob(f))}];
      for (const p of items) { const hash = await storeAsset(p.blob); await putRec('plans', {id: uid(), name: p.name, hash, width: p.width, height: p.height, createdAt: Date.now()}); n++; }
    } catch (e) { console.error(e); toast('Error: ' + (e.message || e)); }
  }
  toast(t('addedPlans', {n}));
  return n;
}

/* ============================================================
   Photos (WebP, content-addressed)
   ============================================================ */
const PHOTO_MAX = 1600, PHOTO_Q = 0.8;
async function decodeImage(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch (e) { /* fall through */ } }
  const url = URL.createObjectURL(file);
  try { return await loadImage(url); } finally { URL.revokeObjectURL(url); }
}
async function fileToWebp(file){
  const im = await decodeImage(file);
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const scale = Math.min(1, PHOTO_MAX / Math.max(iw, ih));
  const w = Math.round(iw * scale), h = Math.round(ih * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(im, 0, 0, w, h);
  if (im.close) im.close();
  let blob = await canvasToBlob(c, 'image/webp', PHOTO_Q);
  if (!blob || blob.type !== 'image/webp') blob = await canvasToBlob(c, 'image/jpeg', 0.82); // browsers without WebP encoding
  return {blob, width: w, height: h};
}
async function addPhotos(marker, files){
  const list = Array.from(files).filter(f => /^image\//.test(f.type));

  for (const f of list) {
    try {
      const p = await fileToWebp(f); const hash = await storeAsset(p.blob);
      await putRec('photos', {id: uid(), markerId: marker.id, projectId: marker.projectId, hash, width: p.width, height: p.height, createdAt: Date.now()}); n++;

}

/* ============================================================
   Viewport (pan / zoom)
   ============================================================ */
const V = { s: 1, tx: 0, ty: 0 };
const vp = $('viewport'), world = $('world'), img = $('planimg'), pinsEl = $('pins');
function applyView(){ world.style.transform = `translate(${V.tx}px,${V.ty}px) scale(${V.s})`; world.style.setProperty('--inv', 1 / V.s); }
function fitView(){
  const plan = curPlan(); if (!plan) return;
  const r = vp.getBoundingClientRect();
  const s = Math.min(r.width / plan.width, r.height / plan.height) * 0.94;
  V.s = s; V.tx = (r.width - plan.width * s) / 2; V.ty = (r.height - plan.height * s) / 2; applyView();
}
function zoomAt(factor, cx, cy){
  const ns = Math.min(Math.max(V.s * factor, 0.02), 20); const k = ns / V.s;
  V.tx = cx - (cx - V.tx) * k; V.ty = cy - (cy - V.ty) * k; V.s = ns; applyView();
}
function screenToRel(clientX, clientY){
  const r = vp.getBoundingClientRect(), plan = curPlan();
  const wx = (clientX - r.left - V.tx) / V.s, wy = (clientY - r.top - V.ty) / V.s;
  return {x: Math.min(1, Math.max(0, wx / plan.width)), y: Math.min(1, Math.max(0, wy / plan.height))};
}
function centerOn(m){
  const plan = curPlan(); if (!plan) return; const r = vp.getBoundingClientRect();
  V.tx = r.width / 2 - m.x * plan.width * V.s; V.ty = r.height / 2 - m.y * plan.height * V.s; applyView();
}
vp.addEventListener('wheel', e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, {passive: false});

const ptrs = new Map(); let gesture = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.pin') || e.target.closest('#toolbar') || !curPlan()) return;
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) gesture = {type: 'pan', sx: e.clientX, sy: e.clientY, tx: V.tx, ty: V.ty, moved: false};
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; gesture = {type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s, tx: V.tx, ty: V.ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: true}; }
});
vp.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (!gesture) return;
  if (gesture.type === 'pan' && ptrs.size === 1) {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.hypot(dx, dy) > 4) { gesture.moved = true; vp.classList.add('panning'); }
    if (gesture.moved) { V.tx = gesture.tx + dx; V.ty = gesture.ty + dy; applyView(); }
  } else if (gesture.type === 'pinch' && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, r = vp.getBoundingClientRect();
    const k = Math.min(Math.max(gesture.s * d / gesture.d, 0.02), 20) / gesture.s;
    const cx = gesture.mx - r.left, cy = gesture.my - r.top;
    V.s = gesture.s * k; V.tx = cx - (cx - gesture.tx) * k + (mx - gesture.mx); V.ty = cy - (cy - gesture.ty) * k + (my - gesture.my); applyView();
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  const g = gesture;
  if (ptrs.size === 0) {
    vp.classList.remove('panning'); gesture = null;
    if (g && g.type === 'pan' && !g.moved && e.type === 'pointerup') {
      if (S.mode === 'add') addMarkerAt(e.clientX, e.clientY);
      else select(null);
    }
  } else if (ptrs.size === 1) { const p = [...ptrs.values()][0]; gesture = {type: 'pan', sx: p.x, sy: p.y, tx: V.tx, ty: V.ty, moved: true}; }
}
vp.addEventListener('pointerup', endPtr); vp.addEventListener('pointercancel', endPtr);
window.addEventListener('resize', () => { if (curPlan()) fitView(); });

let saveTimer = null, dirtyMarker = null;
function scheduleSave(m){ dirtyMarker = m; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 400); }

/* ---------- pin drag ---------- */
function bindPinDrag(el, m){
  let drag = null;
  el.addEventListener('pointerdown', e => { e.stopPropagation(); el.setPointerCapture(e.pointerId); drag = {sx: e.clientX, sy: e.clientY, moved: false}; });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; el.classList.add('dragging'); }
    if (drag.moved) { const r = screenToRel(e.clientX, e.clientY); m.x = r.x; m.y = r.y; el.style.left = (m.x * 100) + '%'; el.style.top = (m.y * 100) + '%'; }
  });
  const up = () => {
    if (!drag) return; const d = drag; drag = null; el.classList.remove('dragging');
    if (d.moved) { scheduleSave(m); select(m.id, {noScroll: true}); }
    else select(m.id, {focus: true});
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

/** Tombstone a project with all its markers and photos. */
async function deleteProjectCascade(proj){
  for (const ph of projectPhotos(proj.id)) await delRec('photos', ph, {silent: true});
  for (const m of projectMarkers(proj.id)) await delRec('markers', m, {silent: true});
  await delRec('projects', proj);
  if (S.projectId === proj.id) { S.projectId = live(S.projects)[0] ? live(S.projects)[0].id : null; S.planId = curProject() && curProject().planIds[0] || null; S.selId = null; await saveMeta(); }
}

function openProjectModal(id){
  const existing = id ? S.projects.find(p => p.id === id) : null;
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {id: uid(), name: '', description: '', planIds: [], categories: [], createdAt: Date.now()};
  const m = modal(existing ? t('editProject') : t('newProject'), `

    <div class="plan-pick" id="pjPlans"></div>`,
    `${existing ? `<button class="danger" id="pjDelete">${esc(t('deleteProject'))}</button><span class="grow"></span>` : ''}<button id="pjCancel">${esc(t('cancel'))}</button><button class="primary" id="pjSave">${esc(t('save'))}</button>`);

    catsEl.querySelectorAll('.cat-row').forEach(row => {

      row.querySelector('input[type=color]').oninput = e => draft.categories[i].color = e.target.value;

    });

  renderCats();
  m.el.querySelector('#pjAddCat').onclick = () => { draft.categories.push({id: uid(), label: '', color: PALETTE[draft.categories.length % PALETTE.length]}); renderCats(); const last = catsEl.querySelector('.cat-row:last-child input[type=text]'); if (last) last.focus(); };
  const plansEl = m.el.querySelector('#pjPlans'); const plans = live(S.plans);
  if (!plans.length) plansEl.innerHTML = `<div class="muted small">${esc(t('noPlansYet'))}</div> <button id="pjOpenLib" class="small" style="margin-top:6px">${esc(t('plans'))}</button>`;
  else plansEl.innerHTML = plans.map(p => `<label><input type="checkbox" value="${p.id}" ${draft.planIds.includes(p.id) ? 'checked' : ''}><img src="${planUrl(p)}"><span>${esc(p.name)}</span></label>`).join('');
  const lib = m.el.querySelector('#pjOpenLib'); if (lib) lib.onclick = () => { m.close(); openLibrary(() => openProjectModal(id)); };
  m.el.querySelector('#pjCancel').onclick = m.close;
  const del = m.el.querySelector('#pjDelete');

  };

    const dropped = projectMarkers(draft.id).filter(mk => !draft.planIds.includes(mk.planId));

function openLibrary(onClose){
  const m = modal(t('library'), `
    <div class="dropzone" id="libDrop">${esc(t('dropHint'))}<input type="file" id="libFile" multiple accept="image/*,application/pdf" class="hidden"></div>

    `<button class="primary" id="libClose">${esc(t('close'))}</button>`);

      row.querySelector('button').onclick = async () => {
        const used = live(S.projects).filter(pr => pr.planIds.includes(p.id));
        let msg = t('confirmDeletePlan', {name: p.name}); if (used.length) msg += '\n\n' + t('planInUse', {list: used.map(u => u.name).join(', ')});
        if (!confirm(msg)) return;
        for (const pr of used) {
          const ms = projectMarkers(pr.id).filter(mk => mk.planId === p.id);
          await deletePhotosOfMarkers(ms.map(mk => mk.id));
          for (const mk of ms) await delRec('markers', mk, {silent: true});
          pr.planIds = pr.planIds.filter(x => x !== p.id); await saveProject(pr);
        }
        await delRec('plans', p);
        if (S.planId === p.id) { S.planId = curProject() && curProject().planIds[0] || null; S.selId = null; await saveMeta(); }
        render(); renderAll();
      };
    });
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { m.el.querySelector('#libStorage').textContent = `${t('storage')}: ${(e.usage / 1048576).toFixed(1)} MB`; });
  };
  render();
  const drop = m.el.querySelector('#libDrop'), file = m.el.querySelector('#libFile');
  drop.onclick = () => file.click();
  file.onchange = async () => { await addPlanFiles(file.files); file.value = ''; render(); renderTabs(); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = async e => { e.preventDefault(); drop.classList.remove('over'); await addPlanFiles(e.dataTransfer.files); render(); renderTabs(); };
  const close = () => { m.close(); if (onClose) onClose(); };
  m.el.querySelector('#libClose').onclick = close; m.el.querySelector('.m-close').onclick = close;
}

function showMenu(anchor, items){
  document.querySelectorAll('.menu').forEach(x => x.remove());
  const menu = document.createElement('div'); menu.className = 'menu';
  menu.innerHTML = items.map(it => it === '-' ? '<hr>' : `<button ${it.disabled ? 'disabled' : ''}>${esc(it.label)}</button>`).join('');
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect(); menu.style.top = (r.bottom + 4) + 'px'; menu.style.left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 8) + 'px';
  let bi = 0; items.forEach(it => { if (it === '-') return; const b = menu.querySelectorAll('button')[bi++]; b.onclick = () => { menu.remove(); it.action(); }; });
  setTimeout(() => document.addEventListener('pointerdown', function h(e){ if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('pointerdown', h); } }), 0);
}

const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function dataURLToBlob(d){ return (await fetch(d)).blob(); }
function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const safeName = s => (s || 'export').replace(/[^\w\-. ]+/g, '_').slice(0, 60);
const dateStr = () => new Date().toISOString().slice(0, 10);

/** Export format v3: full records (incl. tombstones) + assets keyed by hash. */
async function exportJson(projects){
  const pids = new Set(projects.map(p => p.id));
  const planIds = new Set(projects.flatMap(p => p.planIds));
  const plans = S.plans.filter(p => planIds.has(p.id));
  const markers = S.markers.filter(m => pids.has(m.projectId));
  const photos = S.photos.filter(p => pids.has(p.projectId));
  const hashes = new Set([...live(plans).map(p => p.hash), ...live(photos).map(p => p.hash)]);
  const assetsOut = [];
  for (const h of hashes) if (assets.has(h)) assetsOut.push({hash: h, mime: assets.get(h).type, data: await blobToDataURL(assets.get(h))});
  const data = {format: 'floorplan-marker', version: 3, exportedAt: nowIso(), projects, plans, markers, photos, assets: assetsOut};
  const name = projects.length === 1 ? safeName(projects[0].name) : 'floorplan-marker-all';
  download(`${name}_${dateStr()}.json`, new Blob([JSON.stringify(data)], {type: 'application/json'}));
}
/** Accepts export v1/v2 (embedded markers, base64 images) and v3. */
async function normalizeImport(data){
  const out = {projects: [], plans: [], markers: [], photos: [], assets: []};
  const stamp = data.exportedAt || nowIso();
  const st = r => ({...r, updatedAt: r.updatedAt || stamp, deleted: !!r.deleted});
  for (const p of data.plans || []) {
    if (p.image) { const blob = await dataURLToBlob(p.image); const hash = await sha256(blob); out.assets.push({hash, blob}); const {image, ...rest} = p; out.plans.push(st({...rest, hash})); }
    else out.plans.push(st(p));
  }
  for (const pr of data.projects || []) {
    const {markers, ...rest} = pr;
    out.projects.push(st({...rest, planIds: rest.planIds || [], categories: rest.categories || []}));
    for (const m of markers || []) out.markers.push(st({...m, projectId: pr.id}));
  }
  for (const m of data.markers || []) out.markers.push(st(m));
  for (const ph of data.photos || []) {
    if (ph.image) { const blob = await dataURLToBlob(ph.image); const hash = await sha256(blob); out.assets.push({hash, blob}); const {image, ...rest} = ph; out.photos.push(st({...rest, hash})); }
    else out.photos.push(st(ph));
  }
  for (const a of data.assets || []) out.assets.push({hash: a.hash, blob: await dataURLToBlob(a.data)});
  return out;
}
/** Last-write-wins merge of a batch of records into store + memory. Returns number applied. */
async function mergeRecords(store, recs){
  let n = 0;
  for (const r of recs) {
    const local = S[store].find(x => x.id === r.id);
    if (local && local.updatedAt >= r.updatedAt) continue;
    await putRec(store, r, {keepStamp: true, silent: true}); n++;
  }
  return n;
}
async function importJson(file){
  let data; try { data = JSON.parse(await file.text()); if (data.format !== 'floorplan-marker') throw 0; } catch { toast(t('importError')); return; }
  const norm = await normalizeImport(data);
  for (const a of norm.assets) if (!assets.has(a.hash)) { await DB.put('assets', {hash: a.hash, blob: a.blob, mime: a.blob.type, size: a.blob.size}); assets.set(a.hash, a.blob); }
  const np = await mergeRecords('projects', norm.projects), nf = await mergeRecords('plans', norm.plans), nm = await mergeRecords('markers', norm.markers);
  await mergeRecords('photos', norm.photos);
  if (!curProject() && live(S.projects)[0]) { S.projectId = live(S.projects)[0].id; S.planId = curProject().planIds[0] || null; }
  await saveMeta(); Sync.notifyChanged(); renderAll(); toast(t('imported', {p: np, f: nf, m: nm}));
}
function exportCsv(proj){
  const rows = [[t('plan'), t('nr'), t('title'), t('category'), t('notes'), t('status'), t('photos'), 'x', 'y']];
  for (const pid of proj.planIds) { const plan = planById(pid); if (!plan) continue;
    for (const m of projectMarkers(proj.id).filter(x => x.planId === pid).sort((a, b) => a.n - b.n)) rows.push([plan.name, m.n, m.title, (catOf(proj, m.categoryId) || {}).label || '', m.notes, m.done ? t('done') : t('open'), markerPhotos(m.id).length, m.x.toFixed(4), m.y.toFixed(4)]); }
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  download(`${safeName(proj.name)}_${dateStr()}.csv`, new Blob([csv], {type: 'text/csv;charset=utf-8'}));
}

/* ============================================================
   Peer-to-peer sync (PeerJS over WebRTC)
   - identity: persistent UUID in meta store, registered with the PeerJS broker
   - contacts: peers we dial every 30 s; unknown incoming peers need approval
   - protocol per connection: manifest -> want -> records + assets (64 KB chunks) -> done
   - last-write-wins per record on updatedAt; assets are content-addressed (SHA-256)
   Only signalling goes through the broker; records and photo bytes travel peer to peer.
   For testing against a private PeerJS server set localStorage['fpm-peer-server']
   to JSON like {"host":"localhost","port":9000,"path":"/","secure":false}.
   ============================================================ */
const Sync = (() => {
  const ICE = {iceServers: [
    {urls: ['stun:stun.l.google.com:19302', 'stun:stun.relay.metered.ca:80']},
    {urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject'},
    {urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject'},
    {urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject'},
  ]};
  const CHUNK = 65536, DIAL_MS = 30000, DEBOUNCE_MS = 10000, OPEN_TIMEOUT = 20000, BUFFER_HIGH = 4 * 1048576;
  let peer = null, myId = null, status = 'offline', statusMsg = '', panel = null, dialTimer = null;
  const conns = new Map();  // peerId -> entry {conn, dir, state, lastManifest, timer, expect, incoming, stats}
  const pending = new Map(); // unknown incoming peers awaiting the user's decision
  const logLines = [];
  const log = msg => { logLines.push(new Date().toLocaleTimeString() + ' ' + msg); if (logLines.length > 40) logLines.shift(); renderPanel(); };
  const contact = id => S.contacts.find(c => c.peerId === id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- identity & broker ---------- */
  async function init(){
    const m = await DB.get('meta', 'peerId');
    myId = m ? m.id : uid();
    if (!m) await DB.put('meta', {key: 'peerId', id: myId});
    renderBadge();
    if (!window.Peer) {
      await new Promise(res => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'; s.onload = res; s.onerror = () => { status = 'disabled'; res(); }; document.head.appendChild(s); });
    }
    if (!window.Peer) { status = 'disabled'; renderBadge(); return; }
    createPeer();
    window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });
  }
  function createPeer(){
    let opts = {debug: 0, config: ICE};
    try { const o = JSON.parse(localStorage.getItem('fpm-peer-server') || 'null'); if (o) opts = {...opts, ...o}; } catch {}
    status = 'connecting'; renderBadge();
    peer = new Peer(myId, opts);
    peer.on('open', () => { status = 'online'; statusMsg = ''; log('broker: online as ' + myId.slice(0, 8)); renderBadge(); dialAll(); });
    peer.on('connection', handleIncoming);
    peer.on('disconnected', () => { if (status === 'id-taken') return; status = 'offline'; renderBadge(); setTimeout(() => { if (peer && !peer.destroyed && status === 'offline') { status = 'connecting'; renderBadge(); peer.reconnect(); } }, 5000); });
    peer.on('close', () => { if (status !== 'id-taken') status = 'offline'; renderBadge(); });
    peer.on('error', err => {
      const type = err.type || '';
      if (type === 'unavailable-id') { status = 'id-taken'; log('broker: ID already in use elsewhere'); try { peer.destroy(); } catch {} renderBadge(); return; }
      if (type === 'peer-unavailable') return; // dial failure: the contact is simply offline
      if (type === 'network' || type === 'server-error' || type === 'socket-error' || type === 'socket-closed') { status = 'offline'; statusMsg = err.message || type; renderBadge(); setTimeout(() => { if (status === 'offline') { try { peer.destroy(); } catch {} createPeer(); } }, 15000); return; }
      log('error: ' + type + ' ' + (err.message || '')); statusMsg = err.message || type; renderBadge();
    });
    clearInterval(dialTimer); dialTimer = setInterval(dialAll, DIAL_MS);
  }

  /* ---------- dialling & dedupe ---------- */
  function dialAll(){
    if (status !== 'online' || !peer || peer.destroyed || peer.disconnected) return;
    for (const c of S.contacts) if (!conns.has(c.peerId)) dial(c.peerId);
  }
  function dial(pid){
    let conn; try { conn = peer.connect(pid, {reliable: true}); } catch { return; }
    if (!conn) return;
    setupConn(conn, 'out');
    setTimeout(() => { const e = conns.get(pid); if (e && e.conn === conn && e.state !== 'open') { try { conn.close(); } catch {} if (conns.get(pid) === e) conns.delete(pid); renderPanel(); } }, OPEN_TIMEOUT);
  }
  function handleIncoming(conn){
    const pid = conn.peer;
    if (contact(pid)) return adopt(conn, 'in');
    if (pending.has(pid)) { try { conn.close(); } catch {} return; }
    pending.set(pid, conn);
    conn.on('close', () => { if (pending.get(pid) === conn) { pending.delete(pid); } });
    promptUnknown(pid, async label => {
      pending.delete(pid);
      if (label === null) { try { conn.close(); } catch {} return; }
      await addContact(pid, label, {noDial: true});
      adopt(conn, 'in');
    });
  }
  /** Both sides may dial at once: the peer with the lexically lower ID keeps its outgoing connection. */
  function adopt(conn, dir){
    const pid = conn.peer, existing = conns.get(pid);
    if (existing && existing.conn !== conn) {
      const keep = myId < pid ? 'out' : 'in';
      if (dir !== keep) { log('dedupe: dropping duplicate ' + dir + ' from ' + pid.slice(0, 8)); try { conn.close(); } catch {} return; }
      log('dedupe: replacing ' + existing.dir + ' with ' + dir + ' for ' + pid.slice(0, 8));
      const old = existing.conn; conns.delete(pid); try { old.close(); } catch {}
    }
    setupConn(conn, dir);
  }
  function setupConn(conn, dir){
    const pid = conn.peer;
    const entry = {conn, dir, state: 'connecting', lastManifest: 0, timer: null, expect: null, incoming: {}, stats: null};
    conns.set(pid, entry); renderPanel();
    const onOpen = () => {
      if (conns.get(pid) !== entry) return;
      entry.state = 'open'; log((dir === 'out' ? '→ ' : '← ') + 'connected ' + pid.slice(0, 8));
      const c = contact(pid); if (c) { c.lastSeen = Date.now(); DB.put('contacts', c); }
      renderBadge(); requestSync(pid);
    };
    conn.on('open', onOpen);
    conn.on('data', data => onData(entry, data).catch(e => log('error: ' + (e.message || e))));
    const gone = () => { if (conns.get(pid) === entry) { conns.delete(pid); clearTimeout(entry.timer); log('closed ' + pid.slice(0, 8)); renderBadge(); } };
    conn.on('close', gone); conn.on('error', e => { log('conn error ' + pid.slice(0, 8) + ': ' + (e.message || e.type || e)); gone(); });
    if (conn.open) onOpen();
  }

  /* ---------- protocol ---------- */
  function manifest(){
    const records = {};
    for (const s of RECORD_STORES) records[s] = S[s].map(r => [r.id, r.updatedAt, r.deleted ? 1 : 0]);
    const hashes = new Set([...live(S.plans).map(p => p.hash), ...live(S.photos).map(p => p.hash)].filter(h => h && assets.has(h)));
    return {t: 'manifest', records, assets: [...hashes]};
  }
  /** Send our manifest to a peer, at most once per 10 s per peer (later calls are coalesced into one delayed send). */
  function requestSync(pid){
    const e = conns.get(pid); if (!e || e.state !== 'open') return;
    const wait = DEBOUNCE_MS - (Date.now() - e.lastManifest);
    if (wait > 0) { if (!e.timer) e.timer = setTimeout(() => { e.timer = null; requestSync(pid); }, wait); return; }
    e.lastManifest = Date.now(); e.conn.send(manifest());
  }
  async function onData(entry, msg){
    const pid = entry.conn.peer; if (!msg || typeof msg !== 'object') return;
    switch (msg.t) {
      case 'manifest': {
        const want = {records: {}, assets: []}; let nrec = 0;
        for (const s of RECORD_STORES) {
          const local = new Map(S[s].map(r => [r.id, r.updatedAt]));
          want.records[s] = (msg.records[s] || []).filter(([id, upd]) => !local.has(id) || local.get(id) < upd).map(([id]) => id);
          nrec += want.records[s].length;
        }
        want.assets = (msg.assets || []).filter(h => !assets.has(h));
        entry.expect = {assets: new Set(want.assets), done: false}; entry.stats = {records: 0, assets: 0};
        if (nrec || want.assets.length) log('← ' + pid.slice(0, 8) + ': requesting ' + nrec + ' records, ' + want.assets.length + ' files');
        entry.conn.send({t: 'want', ...want}); renderPanel(); break;
      }
      case 'want': {
        const stores = {};
        for (const s of RECORD_STORES) { const ids = new Set(msg.records[s] || []); stores[s] = S[s].filter(r => ids.has(r.id)); }
        entry.conn.send({t: 'records', stores});
        for (const hash of msg.assets || []) { const blob = assets.get(hash); if (blob) await sendAsset(entry.conn, hash, blob); }
        entry.conn.send({t: 'done'}); break;
      }
      case 'records': {
        let n = 0; for (const s of RECORD_STORES) n += await mergeRecords(s, msg.stores[s] || []);
        if (entry.stats) entry.stats.records += n;
        if (n) afterRemoteChange(); break;
      }
      case 'asset': entry.incoming[msg.hash] = {size: msg.size, mime: msg.mime, parts: [], got: 0}; break;
      case 'chunk': {
        const inc = entry.incoming[msg.hash]; if (!inc) break;
        const part = msg.data instanceof ArrayBuffer ? new Uint8Array(msg.data) : new Uint8Array(msg.data.buffer || msg.data);
        inc.parts.push(part); inc.got += part.byteLength;
        if (inc.got >= inc.size) {
          delete entry.incoming[msg.hash];
          const blob = new Blob(inc.parts, {type: inc.mime});
          const h = await sha256(blob);
          if (h === msg.hash) { if (!assets.has(h)) { await DB.put('assets', {hash: h, blob, mime: inc.mime, size: blob.size}); assets.set(h, blob); } if (entry.stats) entry.stats.assets++; afterRemoteChange(); }
          else log('hash mismatch for file from ' + pid.slice(0, 8) + ' — discarded');
          if (entry.expect) { entry.expect.assets.delete(msg.hash); checkFinished(entry); }
        }
        break;
      }
      case 'done': if (entry.expect) { entry.expect.done = true; checkFinished(entry); } break;
    }
  }
  async function sendAsset(conn, hash, blob){
    const buf = await blob.arrayBuffer();
    conn.send({t: 'asset', hash, size: buf.byteLength, mime: blob.type});
    for (let off = 0; off < buf.byteLength; off += CHUNK) {
      conn.send({t: 'chunk', hash, data: buf.slice(off, Math.min(off + CHUNK, buf.byteLength))});
      while (conn.dataChannel && conn.dataChannel.bufferedAmount > BUFFER_HIGH) await sleep(30);
    }
  }
  function checkFinished(entry){
    if (!entry.expect || !entry.expect.done || entry.expect.assets.size) return;
    const pid = entry.conn.peer, st = entry.stats || {records: 0, assets: 0}; entry.expect = null; entry.lastSyncAt = Date.now();
    const c = contact(pid); if (c) { c.lastSeen = Date.now(); c.lastSync = Date.now(); DB.put('contacts', c); }
    if (st.records || st.assets) toast(t('syncDone', {name: c ? c.label : pid.slice(0, 8), r: st.records, a: st.assets}));
    log('sync with ' + pid.slice(0, 8) + ' done: ' + st.records + ' records, ' + st.assets + ' files'); renderPanel();
  }
  let rerenderTimer = null;
  function afterRemoteChange(){
    clearTimeout(rerenderTimer);
    rerenderTimer = setTimeout(() => {
      if (!curProject() && live(S.projects)[0]) { S.projectId = live(S.projects)[0].id; S.planId = curProject().planIds[0] || null; }
      const p = curProject(); if (p && !p.planIds.includes(S.planId)) S.planId = p.planIds[0] || null;
      const active = document.activeElement; const editing = active && active.closest && active.closest('#editpanel');
      if (editing) { renderList(); renderPins(); renderTabs(); renderStage(); } else renderAll();
      notifyChanged(); // relay to other connected peers (they request only what they lack, so this terminates)
    }, 150);
  }
  /** Called by putRec after local changes: offer our manifest to every connected peer (debounced). */
  function notifyChanged(){ for (const pid of conns.keys()) requestSync(pid); }

  /* ---------- contacts ---------- */
  function validId(id){ return /^[A-Za-z0-9_-]{8,64}$/.test(id); }
  async function addContact(pid, label, opts = {}){
    pid = pid.trim(); if (!validId(pid)) { toast(t('invalidPeerId')); return false; }
    if (pid === myId) { toast(t('selfPeerId')); return false; }
    let c = contact(pid);
    if (c) { c.label = label || c.label; } else { c = {peerId: pid, label: label || pid.slice(0, 8), lastSeen: 0}; S.contacts.push(c); }
    await DB.put('contacts', c); renderPanel();
    if (!opts.noDial && status === 'online' && !conns.has(pid)) dial(pid);
    return true;
  }
  async function removeContact(pid){
    const e = conns.get(pid); if (e) { conns.delete(pid); try { e.conn.close(); } catch {} }
    S.contacts = S.contacts.filter(c => c.peerId !== pid); await DB.del('contacts', pid); renderBadge();
  }
  function promptUnknown(pid, cb){
    const m = modal(t('unknownPeer'), `<div class="sync-id">${esc(pid)}</div><p class="small muted">${esc(t('unknownPeerHelp'))}</p><label class="f">${esc(t('name'))}</label><input type="text" id="upLabel" placeholder="${esc(t('labelPh'))}">`,
      `<button id="upNo">${esc(t('decline'))}</button><button class="primary" id="upYes">${esc(t('accept'))}</button>`);
    let answered = false; const answer = v => { if (answered) return; answered = true; m.close(); cb(v); };
    m.el.querySelector('#upYes').onclick = () => answer(m.el.querySelector('#upLabel').value.trim() || pid.slice(0, 8));
    m.el.querySelector('#upNo').onclick = () => answer(null);
    m.el.querySelector('.m-close').onclick = () => answer(null);
  }

  /* ---------- UI ---------- */
  function renderBadge(){
    const dot = $('syncDot'); if (!dot) return;
    const open = [...conns.values()].filter(e => e.state === 'open').length;
    dot.className = 'dot ' + (status === 'id-taken' || status === 'error' ? 'err' : open ? 'on' : status === 'online' || status === 'connecting' ? 'busy' : '');
    $('btnSync').title = t('sync') + ': ' + brokerText() + (open ? ` · ${open} ${t('stConnected').toLowerCase()}` : '');
    renderPanel();
  }
  function brokerText(){
    return status === 'online' ? t('brokerOnline') : status === 'connecting' ? t('brokerConnecting') : status === 'id-taken' ? t('brokerIdTaken') : status === 'disabled' ? t('syncDisabled') : status === 'error' ? t('brokerError', {msg: statusMsg}) : t('brokerOffline') + (statusMsg ? ' (' + statusMsg + ')' : '');
  }
  function renderPanel(){
    if (!panel || !document.body.contains(panel.el)) { panel = null; return; }
    const body = panel.el.querySelector('#syncBody');
    const fmt = ts => ts ? new Date(ts).toLocaleString() : t('never');
    body.innerHTML = `
      <label class="f">${esc(t('myId'))}</label>
      <div class="sync-id"><span class="grow">${esc(myId || '…')}</span><button class="icon" id="syCopy">${esc(t('copy'))}</button></div>
      <div class="small ${status === 'online' ? 'muted' : ''}" style="margin-top:6px"><span class="dot ${status === 'online' ? 'on' : status === 'connecting' ? 'busy' : status === 'id-taken' || status === 'error' || status === 'disabled' ? 'err' : ''}"></span>${esc(brokerText())}</div>
      <label class="f">${esc(t('contacts'))}</label>
      <div id="syContacts">${S.contacts.length ? S.contacts.map(c => { const e = conns.get(c.peerId); const st = e && e.state === 'open' ? (e.expect ? 'stSyncing' : 'stConnected') : e ? 'stConnecting' : 'stOffline';
        return `<div class="contact" data-id="${esc(c.peerId)}"><span class="dot ${e && e.state === 'open' ? (e.expect ? 'busy' : 'on') : e ? 'busy' : ''}"></span><div class="grow"><div class="c-name">${esc(c.label)}</div><div class="c-id">${esc(c.peerId)}</div><div class="c-state">${esc(t(st))} · ${esc(t('lastSync'))}: ${esc(fmt(c.lastSync))}</div></div><button class="icon sy-now" ${e && e.state === 'open' ? '' : 'disabled'} title="${esc(t('syncNow'))}">⟳</button><button class="icon danger sy-del" title="${esc(t('removeContact'))}">✕</button></div>`; }).join('') : `<div class="small muted">${esc(t('noContacts'))}</div>`}</div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap"><input type="text" id="syPeer" class="grow" placeholder="${esc(t('peerIdPh'))}" autocomplete="off" style="min-width:180px"><input type="text" id="syLabel" placeholder="${esc(t('labelPh'))}" style="width:160px"><button class="primary" id="syAdd">${esc(t('addContact'))}</button></div>
      <p class="small muted">${esc(t('syncHelp'))}</p>
      <div class="sync-log">${logLines.length ? logLines.map(esc).join('\n') : '—'}</div>`;
    body.querySelector('#syCopy').onclick = async () => { try { await navigator.clipboard.writeText(myId); toast(t('copied')); } catch { const r = document.createRange(); r.selectNodeContents(body.querySelector('.sync-id span')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
    body.querySelector('#syAdd').onclick = async () => { if (await addContact(body.querySelector('#syPeer').value, body.querySelector('#syLabel').value.trim())) { renderPanel(); } };
    body.querySelectorAll('.contact').forEach(row => {
      const pid = row.dataset.id;
      row.querySelector('.sy-now').onclick = () => { const e = conns.get(pid); if (e) { e.lastManifest = 0; clearTimeout(e.timer); e.timer = null; requestSync(pid); } };
      row.querySelector('.sy-del').onclick = async () => { const c = contact(pid); if (confirm(t('confirmRemoveContact', {name: c ? c.label : pid}))) { await removeContact(pid); renderPanel(); } };
    });
    const logEl = body.querySelector('.sync-log'); logEl.scrollTop = logEl.scrollHeight;
  }
  function openPanel(){
    panel = modal(t('sync'), `<div id="syncBody"></div>`, `<button id="syClose">${esc(t('close'))}</button>`);
    panel.el.querySelector('#syClose').onclick = panel.close;
    renderPanel(); dialAll();
  }
  return {init, notifyChanged, renderBadge, openPanel, addContact, removeContact, get myId(){ return myId; }, get status(){ return status; }, conns};
})();
$('btnSync').onclick = () => Sync.openPanel();

/* ============================================================
   Wiring
   ============================================================ */
$('btnPlans').onclick = () => openLibrary(() => { renderTabs(); renderStage(); });
$('btnLang').onclick = () => { lang = lang === 'nl' ? 'en' : 'nl'; localStorage.setItem('fpm-lang', lang); applyI18n(); renderAll(); };
$('btnNav').onclick = () => setMode('nav');
$('btnAdd').onclick = () => setMode(S.mode === 'add' ? 'nav' : 'add');
$('fab').onclick = () => { setMode(S.mode === 'add' ? 'nav' : 'add'); $('sidebar').classList.remove('open'); };
$('btnFit').onclick = fitView;
$('btnZoomIn').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
$('btnZoomOut').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
$('filter').oninput = e => { S.filter = e.target.value; renderList(); };
$('hideDone').onchange = e => { S.hideDone = e.target.checked; renderList(); };
$('sbHead').addEventListener('click', e => { if (isMobile() && !e.target.closest('input,label')) $('sidebar').classList.toggle('open'); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (document.querySelector('.modal-bg,.lightbox')) return;
  if (e.key === 'Escape') { if (S.mode === 'add') setMode('nav'); else select(null); }
  if (e.key === 'a' || e.key === 'A') setMode(S.mode === 'add' ? 'nav' : 'add');
  if (e.key === 'f' || e.key === 'F') fitView();
  if (e.key === 'Delete' && S.selId) deleteMarker(S.selId);
});
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('beforeprint', () => { const p = curProject(); if (p) buildPrint(p); });
window.addEventListener('pagehide', () => flushSave());

(async function init(){
  applyI18n();
  try { await DB.open(); } catch (e) { toast('Database error: ' + (e.message || e)); return; }
  await migrate();
  await loadAll();
  const meta = await DB.get('meta', 'state');
  if (meta) { S.projectId = meta.projectId; S.planId = meta.planId; }
  if (!curProject() && live(S.projects)[0]) S.projectId = live(S.projects)[0].id;
  const p = curProject(); if (p && !p.planIds.includes(S.planId)) S.planId = p.planIds[0] || null;
  renderAll();
  Sync.init();
})();
</script>
</body>
</html>
